<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme (or the system one) before first paint: no flash of the wrong mode.
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("trustshield.theme");
          theme = saved === "light" || saved === "dark" ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="description" content="TrustShield, built exclusively for the Google Cloud AI Builder Cup. Prototype simulator, synthetic data only. Not affiliated with Google Pay." />
