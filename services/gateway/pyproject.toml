# The gateway is run in place (`uvicorn main:app`), not installed as a package: this file
# only carries the pytest and ruff configuration.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
